name: Build Android APK

on:
  push:
    branches: [ apk-env ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Next.js for Static Export
        run: |
          if [ -f next.config.js ]; then mv next.config.js next.config.js.bak; fi
          if [ -f next.config.mjs ]; then mv next.config.mjs next.config.mjs.bak; fi
          if [ -f next.config.ts ]; then mv next.config.ts next.config.ts.bak; fi
          cat << 'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            webpack: (config, { isServer }) => {
              if (!isServer) {
                config.resolve.fallback = {
                  ...config.resolve.fallback,
                  fs: false,
                  path: false,
                  crypto: false,
                  stream: false,
                };
              }
              return config;
            },
          };
          module.exports = nextConfig;
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build web (彻底粉碎所有 API 路由)
        run: |
          # 暴力粉碎所有在纯静态 APK 里跑不了的后端和3D代码，不再恢复！
          rm -rf app/api
          rm -rf app/world-builder
          rm -rf app/personal-shortcut-run
          rm -rf app/manifest.webmanifest
          rm -rf app/sitemap.ts
          rm -rf app/robots.ts
          
          # 全局扫荡：删掉所有含有 route.ts 或 route.js 的目录
          find app -type f \( -name "route.ts" -o -name "route.js" \) -exec dirname {} \; | sort -u | xargs -I {} rm -rf {} 2>/dev/null || true
          
          # 执行纯前端构建
          npm run build

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Float小手机" "com.xiaonian.float" --web-dir out
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
