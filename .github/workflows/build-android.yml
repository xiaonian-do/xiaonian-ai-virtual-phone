name: Build Android APK

on:
  push:
    branches: [ apk-env ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 关键修改：跳过了安装 SDK 的步骤，直接手动接受许可（解决和上次一样的报错）
      - name: Accept Android SDK Licenses
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # 配置 Next.js 为纯静态导出，准备塞进 APK
      - name: Configure Next.js for Static Export
        run: |
          if [ -f next.config.js ]; then mv next.config.js next.config.js.bak; fi
          if [ -f next.config.mjs ]; then mv next.config.mjs next.config.mjs.bak; fi
          if [ -f next.config.ts ]; then mv next.config.ts next.config.ts.bak; fi
          echo "const nextConfig = { output: 'export', images: { unoptimized: true } }; module.exports = nextConfig;" > next.config.js

      - name: Install dependencies
        run: npm install

      - name: Build web
        run: npm run build

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Float小手机" "com.xiaonian.float" --web-dir out
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
