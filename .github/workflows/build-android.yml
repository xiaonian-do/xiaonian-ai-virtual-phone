name: Build Android APK

on:
  push:
    branches: [ apk-env ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: echo "y" | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Configure Next.js for Static Export
        run: |
          if [ -f next.config.js ]; then mv next.config.js next.config.js.bak; fi
          if [ -f next.config.mjs ]; then mv next.config.mjs next.config.mjs.bak; fi
          if [ -f next.config.ts ]; then mv next.config.ts next.config.ts.bak; fi
          cat << 'EOF' > next.config.js
          /** @type {import('next').NextConfig} */
          const nextConfig = {
            output: 'export',
            images: { unoptimized: true },
            typescript: { ignoreBuildErrors: true },
            eslint: { ignoreDuringBuilds: true },
            webpack: (config, { isServer }) => {
              if (!isServer) {
                config.resolve.fallback = {
                  ...config.resolve.fallback,
                  fs: false,
                  path: false,
                  crypto: false,
                  stream: false,
                };
              }
              return config;
            },
          };
          module.exports = nextConfig;
          EOF

      - name: Install dependencies
        run: npm install

      - name: Build web (彻底剥离服务器端功能)
        run: |
          # 创建临时备份区
          mkdir -p /tmp/next_backup
          
          # 剥离所有在纯静态导出中会报错的后端/动态/3D依赖
          mv app/api /tmp/next_backup/ 2>/dev/null || true
          mv app/world-builder /tmp/next_backup/ 2>/dev/null || true
          mv app/manifest.webmanifest /tmp/next_backup/ 2>/dev/null || true
          mv app/sitemap.ts /tmp/next_backup/ 2>/dev/null || true
          mv app/robots.ts /tmp/next_backup/ 2>/dev/null || true
          
          # 执行构建（此时只剩下纯前端页面）
          npm run build
          
          # 构建完成后，原样恢复所有被剥离的文件夹
          mv /tmp/next_backup/* app/ 2>/dev/null || true

      - name: Setup Capacitor
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Float小手机" "com.xiaonian.float" --web-dir out
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
